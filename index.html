<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Major Draft</title>

    <link
        rel="stylesheet"
        href="css/styles.css"
    >
</head>

<body>

    <main>
        <!--DRAFT-->
        <section id="draftArea">
            
            <h1>Major Draft</h1>

            <div 
                id="turn" 
                class="turn"
            ></div>

            <section>

                <h2>Time Sorteado</h2>
    
                <div 
                    id="releasedTeam" 
                    class="list"
                ></div>
    
                <button id="reroll">
                    Reroll
                </button>
    
                <span 
                    id="remainingRerolls"
                ></span>

            </section>
    
            <section>
                <h2>Meu Time</h2>
                
                <div 
                    id="myTeam"
                    class="list"
                ></div>

            </section>
    
            <button
                id="startSimulation"
                disabled
            >
                Entrar no Major
            </button>

        </section>

        <!--SIMULATION-->
        <section
            id="simulation"
            class="simulation"
            style="display: none;"
        >
            <h1>
                Major Simulation
            </h1>

            <div
                id="simulationStage"
                class="simulation-stage"
            ></div>

             <div
                id="simulationUserTeam"
                class="simulation-user-team"
            ></div>

            <div
                id="simulationResult"
                class="simulation-result"
            ></div>

            <button id="simulateRound">
                Simular Rodada
            </button>
            
            <div
                id="standings"
                class="standings"
            ></div>
            
        </section>

    </main>

    <script
        type="module"
        src="js/app.js"
    ></script>

</body>

</html>
